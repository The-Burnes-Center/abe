name: PR Check

# Runs the shared test suite (with coverage) on every pull request. The deploy
# role is never used here. If the repository defines an AWS_DIFF_ROLE_ARN
# secret (a read-only role trusted for GitHub OIDC), a `cdk diff` against the
# deployed stack is written to the job summary. Pull requests from forks never
# receive secrets, so for them the diff is skipped.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      coverage: true

  config:
    runs-on: ubuntu-latest
    outputs:
      can-diff: ${{ steps.check.outputs.can-diff }}
    steps:
      - id: check
        env:
          AWS_DIFF_ROLE_ARN: ${{ secrets.AWS_DIFF_ROLE_ARN }}
        run: |
          if [ -n "$AWS_DIFF_ROLE_ARN" ]; then
            echo "can-diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-diff=false" >> "$GITHUB_OUTPUT"
          fi

  cdk-diff:
    needs: [config, test]
    if: needs.config.outputs.can-diff == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'ABEStack' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lib/user-interface/app/package-lock.json

      - name: Export deployment settings
        # Same settings as deploy.yml so the diff matches what a deploy would do.
        env:
          IN_CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          IN_CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
          IN_ALLOWED_SIGNUP_DOMAINS: ${{ vars.ALLOWED_SIGNUP_DOMAINS }}
          IN_COGNITO_FEATURE_PLAN: ${{ vars.COGNITO_FEATURE_PLAN }}
          IN_ENABLE_EVAL: ${{ vars.ENABLE_EVAL }}
          IN_KB_PARSER_MODEL: ${{ vars.KB_PARSER_MODEL }}
          IN_API_GATEWAY_ACCOUNT_ROLE: ${{ vars.API_GATEWAY_ACCOUNT_ROLE }}
          IN_ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          IN_PRIMARY_MODEL_ID: ${{ vars.PRIMARY_MODEL_ID }}
          IN_FAST_MODEL_ID: ${{ vars.FAST_MODEL_ID }}
          IN_GUARDRAIL_ID: ${{ vars.GUARDRAIL_ID }}
          IN_GUARDRAIL_VERSION: ${{ vars.GUARDRAIL_VERSION }}
          IN_ASSISTANT_NAME: ${{ vars.ASSISTANT_NAME }}
          IN_SHORT_NAME: ${{ vars.SHORT_NAME }}
          IN_ORGANIZATION_NAME: ${{ vars.ORGANIZATION_NAME }}
          IN_BRAND_TAGLINE: ${{ vars.BRAND_TAGLINE }}
          IN_SUPPORT_CONTACT: ${{ vars.SUPPORT_CONTACT }}
          IN_DOMAIN_CONTEXT: ${{ vars.DOMAIN_CONTEXT }}
          IN_BRAND_TIMEZONE: ${{ vars.BRAND_TIMEZONE }}
        run: |
          for name in $(env | grep -o '^IN_[A-Z_]*' | sort); do
            value="${!name}"
            [ -z "$value" ] && continue
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::${name#IN_} must be a single line"; exit 1
            fi
            echo "${name#IN_}=$value" >> "$GITHUB_ENV"
          done

      - name: Configure AWS credentials (read-only diff role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: pr-diff-${{ github.event.pull_request.number }}
          mask-aws-account-id: true

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix lib/user-interface/app ci

      - name: Generate frontend brand files
        run: npm run brand:sync

      - name: CDK diff
        run: |
          set -o pipefail
          npx cdk diff "$STACK_NAME" 2>&1 | tee cdk-diff.txt
          {
            echo "## CDK diff: ${STACK_NAME} (${AWS_REGION})"
            echo '```'
            head -500 cdk-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
