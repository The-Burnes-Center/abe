name: Deploy

# Tests every push to main, then deploys with CDK when the repository has an
# AWS_ROLE_ARN secret (an IAM role trusted for GitHub OIDC). Forks without that
# secret run the tests and skip the deploy cleanly.
#
# Repository configuration (all optional unless noted):
#   Secrets:   AWS_ROLE_ARN (required to deploy), CERTIFICATE_ARN, ALARM_EMAIL
#   Variables: STACK_NAME (ABEStack), AWS_REGION (us-east-1), CUSTOM_DOMAIN,
#              ALLOWED_SIGNUP_DOMAINS, COGNITO_FEATURE_PLAN, ENABLE_EVAL,
#              KB_PARSER_MODEL, API_GATEWAY_ACCOUNT_ROLE, ENVIRONMENT,
#              PRIMARY_MODEL_ID, FAST_MODEL_ID, GUARDRAIL_ID, GUARDRAIL_VERSION,
#              and brand: ASSISTANT_NAME, SHORT_NAME, ORGANIZATION_NAME,
#              BRAND_TAGLINE, SUPPORT_CONTACT, DOMAIN_CONTEXT, BRAND_TIMEZONE
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      can-deploy: ${{ steps.check.outputs.can-deploy }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "can-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-deploy=false" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_ARN secret not set: tests only, deploy skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [config, test]
    if: needs.config.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'ABEStack' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lib/user-interface/app/package-lock.json

      - name: Export deployment settings
        # Only non-empty values are exported, so unset variables fall back to
        # the defaults in config/brand.ts and lib/deployment-config.ts.
        env:
          IN_CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          IN_CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
          IN_ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          IN_ALLOWED_SIGNUP_DOMAINS: ${{ vars.ALLOWED_SIGNUP_DOMAINS }}
          IN_COGNITO_FEATURE_PLAN: ${{ vars.COGNITO_FEATURE_PLAN }}
          IN_ENABLE_EVAL: ${{ vars.ENABLE_EVAL }}
          IN_KB_PARSER_MODEL: ${{ vars.KB_PARSER_MODEL }}
          IN_API_GATEWAY_ACCOUNT_ROLE: ${{ vars.API_GATEWAY_ACCOUNT_ROLE }}
          IN_ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          IN_PRIMARY_MODEL_ID: ${{ vars.PRIMARY_MODEL_ID }}
          IN_FAST_MODEL_ID: ${{ vars.FAST_MODEL_ID }}
          IN_GUARDRAIL_ID: ${{ vars.GUARDRAIL_ID }}
          IN_GUARDRAIL_VERSION: ${{ vars.GUARDRAIL_VERSION }}
          IN_ASSISTANT_NAME: ${{ vars.ASSISTANT_NAME }}
          IN_SHORT_NAME: ${{ vars.SHORT_NAME }}
          IN_ORGANIZATION_NAME: ${{ vars.ORGANIZATION_NAME }}
          IN_BRAND_TAGLINE: ${{ vars.BRAND_TAGLINE }}
          IN_SUPPORT_CONTACT: ${{ vars.SUPPORT_CONTACT }}
          IN_DOMAIN_CONTEXT: ${{ vars.DOMAIN_CONTEXT }}
          IN_BRAND_TIMEZONE: ${{ vars.BRAND_TIMEZONE }}
        run: |
          for name in $(env | grep -o '^IN_[A-Z_]*' | sort); do
            value="${!name}"
            [ -z "$value" ] && continue
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::${name#IN_} must be a single line"; exit 1
            fi
            echo "${name#IN_}=$value" >> "$GITHUB_ENV"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: lib/user-interface/app
        run: npm ci

      - name: Generate frontend brand files
        # Applies the brand Variables above to the committed frontend brand
        # module so a deployment can brand itself without editing config.
        run: npm run brand:sync

      - name: Bootstrap CDK environment
        # Idempotent: a no-op when the bootstrap stack is already current.
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          npx cdk bootstrap "aws://${ACCOUNT}/${AWS_REGION}"

      - name: Wait for stack to reach a stable state
        run: |
          status() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "DOES_NOT_EXIST"
          }
          STATUS=$(status)
          echo "Current stack status: $STATUS"
          if [[ "$STATUS" == *_IN_PROGRESS ]]; then
            echo "Waiting up to 30 minutes for the in-progress operation to finish..."
            for _ in $(seq 1 120); do
              STATUS=$(status)
              [[ "$STATUS" != *_IN_PROGRESS ]] && break
              sleep 15
            done
            echo "Stack settled at: $STATUS"
          fi
          case "$STATUS" in
            *_IN_PROGRESS) echo "::error::Stack is still $STATUS"; exit 1 ;;
            *_FAILED|ROLLBACK_COMPLETE) echo "::error::Stack is in a failed state: $STATUS"; exit 1 ;;
          esac

      - name: Deploy CDK stack
        run: npx cdk deploy "$STACK_NAME" --require-approval never

      - name: Deployment summary
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue | [0]" --output text)
          {
            echo "## Deployed ${STACK_NAME} (${AWS_REGION})"
            echo "App URL: ${URL}"
            echo "Invite an admin: scripts/create-admin.sh --email you@example.org --stack-name ${STACK_NAME} --region ${AWS_REGION}"
          } >> "$GITHUB_STEP_SUMMARY"
