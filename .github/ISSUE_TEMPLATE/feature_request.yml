name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Early ideas are welcome in [Discussions](https://github.com/The-Burnes-Center/abe/discussions) (Ideas category). Use this form once the idea is concrete enough to plan. Breaking changes, new AWS services and changes to the auth or security model need an agreed approach before code (see GOVERNANCE.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat and tools
        - Admin console
        - Authentication and users
        - Infrastructure (CDK)
        - Evaluation pipeline
        - Branding and configuration
        - Documentation
        - CI and tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, costs, or constraints (for example extra AWS services or permissions).
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
